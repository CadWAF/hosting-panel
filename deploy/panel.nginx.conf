# Panel vhost. Replace PANEL_DOMAIN; put it behind HTTPS (certbot --nginx -d PANEL_DOMAIN) before real use.
server {
    listen 80;
    listen [::]:80;
    server_name PANEL_DOMAIN;
    root /opt/hostingpanel/panel/public;
    index index.php;
    client_max_body_size 512m;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/hostingpanel-panel.sock;
    }
    location ~ /\.(?!well-known) { deny all; }
}
