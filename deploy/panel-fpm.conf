; Dedicated php-fpm master for the Panel. Independent of site PHP runtimes, so reloading
; or upgrading a site's PHP never interrupts the Panel (and the Panel can't be taken down by a site).
[global]
pid = /run/hostingpanel-fpm/panel-fpm.pid
error_log = /var/log/hostingpanel/panel-fpm.log
daemonize = no

[hostingpanel-panel]
user = hostingpanel
group = hostingpanel
listen = /run/php/hostingpanel-panel.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 8
php_admin_value[open_basedir] = /opt/hostingpanel/panel:/tmp:/run/hostingpanel
